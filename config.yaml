# proper-roger: CW ragchew corpus and default settings.
#
# This is ordinary YAML, but pr.py reads it with a tiny built-in parser that
# understands only this subset:
#   - nested "key: value" mappings (indent with spaces, never tabs)
#   - "- item" lists and [a, b, c] flow lists of scalars
#   - plain, 'single-quoted' or "double-quoted" scalars, comments with #
# No anchors, multi-line strings, {flow mappings} or lists of mappings.
#
# Templates may only use characters pr.py can send in Morse:
# letters, digits, space and . , ? / = + - @   (case does not matter).

# --------------------------------------------------------------------------
# Defaults for the command line (every option can still be overridden).
# --------------------------------------------------------------------------
defaults:
  wpm: 18
  farnsworth: null      # null = same as wpm, i.e. no Farnsworth spacing
  difficulty: 2         # 1-5, language complexity, independent from speed
  mode: mixed           # blocks | phrases | mixed
  tone: 650             # sidetone in Hz
  volume: 0.5           # 0.0 - 1.0
  # player: "ffplay -nodisp -autoexit -loglevel quiet"   # force a player command

# --------------------------------------------------------------------------
# Vocabulary. {name}, {qth}, ... in a template pick one entry at random.
#   {name} {name}   -> the same value twice (NAME HANS HANS), as operators do
#   {rig} ... {rig2} -> two different values from the same list
# --------------------------------------------------------------------------
vocab:
  name: [HANS, PETER, DIETER, KARL, JOHN, MARCO, PAUL, JEAN, PIERRE, LUC,
         TOM, BOB, DAVE, MIKE, STEVE, JIM, BILL, RON, ANDY, ERIK, LARS,
         SVEN, JAN, PIET, PAOLO, LUIGI, PEDRO, JOSE, TONY, FRED]

  qth: [BERLIN, HAMBURG, BONN, MUNICH, PARIS, LYON, BRUSSELS, PRAGUE, VIENNA,
        ZURICH, MILAN, ROME, MADRID, LISBON, OSLO, STOCKHOLM, HELSINKI,
        COPENHAGEN, DUBLIN, LONDON, BRISTOL, LEEDS, WARSAW, KRAKOW, BUDAPEST,
        GENT, UTRECHT, NANTES, TOULOUSE, BORDEAUX, DIJON, LILLE, GRENOBLE]

  rig: [K1, K2, K3, KX1, KX2, KX3, KH1, QCX, QMX, IC7300, IC705, FT817,
        FT818, FT891, TS590, TR35, MTR3B, SW3B, G90]

  antenna: [DIPOLE, EFHW, VERTICAL, LOOP, RANDOM WIRE, INV V, G5RV, DOUBLET,
            GP, WINDOM, MAG LOOP, HEX BEAM]

  power: [1W, 3W, 5W, 10W, 20W, 50W, 100W]

  weather: [SUNNY, CLOUDY, RAIN, WINDY, FOG, OVERCAST, DRIZZLE, SNOW, CLEAR]

  band: [80M, 40M, 30M, 20M, 17M, 15M]

  rst: [559, 569, 579, 589, 599, 449, 459, 339]

  key: [STRAIGHT KEY, PADDLE, BUG, COOTIE, IAMBIC PADDLE]

  job: [TEACHER, ENGINEER, NURSE, FARMER, PILOT, ELECTRICIAN, DOCTOR,
        MECHANIC, PROGRAMMER, SAILOR]

  hobby: [HIKING, CYCLING, FISHING, GARDENING, SAILING, CHESS, SKIING, RUNNING]

  # "JUST CAME BACK FROM {activity}"
  activity: [A WALK WITH THE DOG, WORK, THE GARDEN, A POTA ACTIVATION,
             A SOTA HIKE, THE RADIO CLUB, SHOPPING, FISHING, A BIKE RIDE,
             THE BEACH, HOLIDAY]

  # past moments: "WORKED {qth} {when}"
  when: [YESTERDAY, LAST NIGHT, LAST WEEKEND, THIS MORNING, LAST WEEK]

# --------------------------------------------------------------------------
# Integer ranges: {temp} picks a whole number between low and high.
# --------------------------------------------------------------------------
ranges:
  temp: [8, 24]           # generic temperature in C
  temp_low: [-8, 7]       # used with "COLD"
  temp_high: [23, 35]     # used with "WARM" / "HOT"
  height: [5, 15]         # antenna height in metres
  years: [2, 55]          # years as a ham, years retired...
  year: [1968, 2022]      # a year in the past
  age: [19, 84]
  licence_age: [14, 45]   # age when licensed

# --------------------------------------------------------------------------
# Blocks: short reusable chunks, to be heard as one unit.
# --------------------------------------------------------------------------
blocks:
  1:
    - "NAME {name}"
    - "QTH {qth}"
    - "RIG {rig}"
    - "PWR {power}"
    - "ANT {antenna}"
    - "UR RST {rst}"
    - "WX {weather}"
    - "TEMP {temp}C"
    - "GM OM"
    - "GE OM"
    - "TNX FER CALL"
    - "73 OM"
    - "HW CPY"
    - "FB"
    - "R R"
    - "TU"

  2:
    - "NAME HR {name}"
    - "QTH HR {qth}"
    - "RIG HR {rig}"
    - "ANT HR {antenna}"
    - "PWR HR {power}"
    - "TNX FER RPRT"
    - "UR SIG FB"
    - "HW CPY NW"
    - "BK TO U"
