# proper-roger: CW ragchew corpus and default settings.
#
# Standard TOML, read with Python's built-in tomllib. Strings must be quoted;
# lists may span several lines and end with a trailing comma.
#
# Templates may only use characters pr.py can send in Morse:
# letters, digits, space and . , ? / = + - @   (case does not matter),
# plus prosigns in angle brackets, sent without a gap between their letters:
# <AR> <KN> <SK> <BK> ...   "=" is BT, the usual separator between topics.

# --------------------------------------------------------------------------
# Defaults for the command line (every option can still be overridden).
# --------------------------------------------------------------------------
[defaults]
wpm = 18
# farnsworth = 15       # effective speed; leave out for none (same as wpm)
difficulty = 2          # 1-5, language complexity, independent from speed
mode = "mixed"          # "blocks" | "phrases" | "mixed"
tone = 600              # sidetone / receive pitch in Hz
volume = 0.5            # 0.0 - 1.0
station = 8             # phrases from the same station before a new one, 0 = no station
# Band conditions: a calm, real band. `--clean` on the command line turns
# them all off for a perfect keyer on a silent band.
fist = 5                # human timing variation, % of each element (0-50)
vary = 1                # each station sends up to +/- this many WPM off --wpm (0-10)
qsb = 0.2               # fading depth 0.0 - 1.0
noise = 0.15            # band noise 0.0 - 1.0 (0.15 calm, 0.3 busy, 0.5 noisy)
qrm = 0.0               # a station calling CQ nearby, 0.0 - 1.0 (try 0.3)
filter = 400            # receiver CW filter in Hz (100-1000), used with noise or qrm
shape = "soft"          # filter shape: "soft" (round, no ringing) | "sharp" (steep, rings)
# player = "ffplay -nodisp -autoexit -loglevel quiet"   # force a player command

# --------------------------------------------------------------------------
# The station you are listening to. For `station` phrases in a row these
# placeholders keep the same value, so you follow one operator: same name,
# same QTH, same rig. {rig2} still gives a rig different from {rig}: use
# it for anything that is not the station's own ("UR {rig2} SOUNDS FB",
# "WORKED {qth2} LAST NIGHT").
# --------------------------------------------------------------------------
[station]
keys = ["name", "qth", "rig", "antenna", "power", "key", "job", "hobby",
        "height", "band"]

# --------------------------------------------------------------------------
# Vocabulary. {name}, {qth}, ... in a template pick one entry at random.
#   {name} {name}   -> the same value twice (NAME HANS HANS), as operators do
#   {rig} ... {rig2} -> two different values from the same list
# --------------------------------------------------------------------------
[vocab]
name = ["HANS", "PETER", "DIETER", "KARL", "JOHN", "MARCO", "PAUL", "JEAN",
        "PIERRE", "LUC", "TOM", "BOB", "DAVE", "MIKE", "STEVE", "JIM",
        "BILL", "RON", "ANDY", "ERIK", "LARS", "SVEN", "JAN", "PIET",
        "PAOLO", "LUIGI", "PEDRO", "JOSE", "TONY", "FRED"]

qth = ["BERLIN", "HAMBURG", "BONN", "MUNICH", "PARIS", "LYON", "BRUSSELS",
       "PRAGUE", "VIENNA", "ZURICH", "MILAN", "ROME", "MADRID", "LISBON",
       "OSLO", "STOCKHOLM", "HELSINKI", "COPENHAGEN", "DUBLIN", "LONDON",
       "BRISTOL", "LEEDS", "WARSAW", "KRAKOW", "BUDAPEST", "GENT", "UTRECHT",
       "NANTES", "TOULOUSE", "BORDEAUX", "DIJON", "LILLE", "GRENOBLE"]

rig = ["K1", "K2", "K3", "KX1", "KX2", "KX3", "KH1", "QCX", "QMX", "IC7300",
       "IC705", "FT817", "FT818", "FT891", "TS590", "TR35", "MTR3B", "SW3B",
       "G90"]

antenna = ["DIPOLE", "EFHW", "VERTICAL", "LOOP", "RANDOM WIRE", "INV V",
           "G5RV", "DOUBLET", "GP", "WINDOM", "MAG LOOP", "HEX BEAM"]

power = ["1W", "3W", "5W", "10W", "20W", "50W", "100W"]

weather = ["SUNNY", "CLOUDY", "RAIN", "WINDY", "FOG", "OVERCAST", "DRIZZLE",
           "SNOW", "CLEAR"]

band = ["80M", "40M", "30M", "20M", "17M", "15M"]

rst = ["559", "569", "579", "589", "599", "449", "459", "339"]

key = ["STRAIGHT KEY", "PADDLE", "BUG", "COOTIE", "IAMBIC PADDLE"]

job = ["TEACHER", "ENGINEER", "NURSE", "FARMER", "PILOT", "ELECTRICIAN",
       "DOCTOR", "MECHANIC", "PROGRAMMER", "SAILOR"]

hobby = ["HIKING", "CYCLING", "FISHING", "GARDENING", "SAILING", "CHESS",
         "SKIING", "RUNNING"]

# "JUST CAME BACK FROM {activity}"
activity = ["A WALK WITH THE DOG", "WORK", "THE GARDEN", "A POTA ACTIVATION",
            "A SOTA HIKE", "THE RADIO CLUB", "SHOPPING", "FISHING",
            "A BIKE RIDE", "THE BEACH", "HOLIDAY"]

# past moments: "WORKED {qth2} {when}"
when = ["YESTERDAY", "LAST NIGHT", "LAST WEEKEND", "THIS MORNING",
        "LAST WEEK"]

# --------------------------------------------------------------------------
# Integer ranges: {temp} picks a whole number between low and high.
# Keep them non-negative: below zero is sent as "MINUS {frost}C".
# --------------------------------------------------------------------------
[ranges]
temp = [8, 24]           # generic temperature in C
temp_low = [0, 7]        # used with "COLD"
frost = [1, 10]          # below zero: "MINUS {frost}C"
temp_high = [23, 35]     # used with "WARM" / "HOT"
height = [5, 15]         # antenna height in metres
years = [2, 55]          # years as a ham, years retired...
year = [1968, 2022]      # a year in the past
age = [19, 84]
age_retired = [60, 84]   # used with "RETIRED"
licence_age = [14, 45]   # age when licensed

# --------------------------------------------------------------------------
# Blocks: short reusable chunks, to be heard as one unit.
# --------------------------------------------------------------------------
[blocks]
1 = [
  "NAME {name}",
  "QTH {qth}",
  "RIG {rig}",
  "PWR {power}",
  "ANT {antenna}",
  "UR RST {rst}",
  "WX {weather}",
  "TEMP {temp}C",
  "GM OM",
  "GE OM",
  "TNX FER CALL",
  "73 OM",
  "HW CPY",
  "FB",
  "R R",
  "TU",
  "73 <SK>",
  "BK <KN>",
]
2 = [
