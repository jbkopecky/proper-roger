1 = [
  "NAME {name} {name}",
  "QTH {qth} {qth}",
  "UR RST {rst} {rst}",
  "RIG {rig} {rig}",
  "PWR {power} {power}",
  "ANT {antenna} {antenna}",
  "WX {weather} {weather}",
  "TEMP {temp}C {temp}C",
  "R R TNX FER CALL",
  "GM ES TNX FER CALL",
  "NAME IS {name}",
  "MY QTH IS {qth}",
]
2 = [
  "NAME {name} QTH {qth}",
